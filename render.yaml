# Render Blueprint — VisioFab WMS Backend
# Deploy: connect GitHub repo → Render auto-detects this file

services:
  - type: web
    name: visiofab-wms-api
    runtime: docker
    plan: free
    disk:
      name: visiofab-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard with Neon URL
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3333
      - key: NODE_ENV
        value: production
      - key: PERSISTENT_STORAGE_PATH
        value: /var/data
      # Chave que habilita as rotas de seed de QA (/api/qa-seed/*).
      # Necessária para a suíte E2E exercitar fluxos de onda/expedição que,
      # em produção, só seriam atingidos por emissão de NF-e real à SEFAZ.
      # Além desta chave, cada requisição exige JWT válido de usuário autenticado.
      - key: WMS_QA_SEED_KEY
        value: qa-seed-visiofab-2026
    healthCheckPath: /api/health
    buildCommand: ""
    startCommand: ""
